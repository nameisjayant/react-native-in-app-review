name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Lint, typecheck and test
        run: |
          yarn lint
          yarn typecheck
          yarn test --maxWorkers=2

      - name: Build package
        run: yarn prepare

      # Uses npm trusted publishing (OIDC): no token, works with 2FA.
      # Configure it once on npmjs.com → package → Settings → Trusted publisher.
      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
